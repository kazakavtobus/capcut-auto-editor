name: Windows EXE + Installer release
on:
  push:
    branches:
      - main
      - studio-v8
      - studio-v81
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Validate release tag and version
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version.py v$version"
          }
      - name: Install runtime and packaging requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          choco install ffmpeg --yes --no-progress
          choco install innosetup --yes --no-progress
          python -c "import PySide6.QtMultimedia; import librosa; import faster_whisper; print('runtime imports OK')"
      - name: Bundle local Three.js composition preview
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'studio-preview'
          New-Item -ItemType Directory -Force $deps | Out-Null
          npm install --prefix $deps --no-audit --no-fund three@0.170.0 esbuild@0.24.2
          if ($LASTEXITCODE -ne 0) { throw 'Preview dependencies failed' }
          Copy-Item 'preview/compose.js' "$deps/compose.js"
          & "$deps/node_modules/.bin/esbuild.cmd" "$deps/compose.js" --bundle --minify --outfile=assets/composition.bundle.js
          if ($LASTEXITCODE -ne 0) { throw 'Three.js bundle failed' }
          Copy-Item "$deps/node_modules/three/LICENSE" 'assets/three-LICENSE.txt'
      - name: Run unit tests and validate source
        shell: pwsh
        run: |
          python -m py_compile app.py manual_lyrics.py studio_media.py studio_pipeline.py studio_ui.py studio_profiles.py desktop_ui.py composition_preview.py builder.py
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }
          python -m unittest test_v73 test_semantic test_regression test_editor test_song_library test_project_reuse test_manual_lyrics test_studio -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
      - name: Smoke test manual song library UI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from app import ManualSongDialog,SongLibraryDialog,MainWindow; from studio_ui import MediaDialog,ProfilesDialog; import tempfile; q=QApplication([]); d=ManualSongDialog(None); x=SongLibraryDialog(None); w=MainWindow(); tmp=tempfile.TemporaryDirectory(); m=MediaDialog(None,tmp.name); p=ProfilesDialog(None,tmp.name); assert len(p.states)==2; p.close(); assert d.table.columnCount()==3; assert x.table.columnCount()==4; assert m.table.columnCount()==6; assert len(w.counts)==2; w.change_page(3); assert w.media_page.grid is not None; w.change_page(4); assert w.songs_page.list is not None; w.change_page(6); assert len(w.profiles_page.states)==2; w.change_page(0); m.close(); d.close(); x.close(); w.close(); tmp.cleanup(); print('Studio UI OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Manual song library UI smoke test failed' }
      - name: Build PyInstaller app (no private templates or personal files)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name CapCutAutoEditor `
            --icon assets/app_icon.ico `
            --add-data "assets;assets" `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all av `
            --collect-all librosa `
            --collect-all scipy `
            --hidden-import=PySide6.QtMultimedia `
            --hidden-import=PySide6.QtWebEngineWidgets `
            --hidden-import=PySide6.QtWebEngineCore `
            --collect-all sklearn `
            app.py
          $destination = 'dist/CapCutAutoEditor'
          # imageio-ffmpeg provides a self-contained Windows FFmpeg build.
          # The Chocolatey executable can depend on side-by-side DLLs that are
          # not copied into the installer, causing silent conversion failures.
          $standalone = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if (!(Test-Path $standalone)) { throw 'Standalone FFmpeg binary not found' }
          Copy-Item $standalone "$destination/ffmpeg.exe"
          & "$destination/ffmpeg.exe" -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'Standalone FFmpeg does not launch' }
          $encoders = & "$destination/ffmpeg.exe" -hide_banner -encoders
          if ($LASTEXITCODE -ne 0 -or -not ($encoders -match 'libx264')) {
            throw 'Bundled FFmpeg does not support H.264 encoding (libx264)'
          }
          Copy-Item (Get-Command ffprobe.exe).Source "$destination/ffprobe.exe"
          if (!(Test-Path "$destination/CapCutAutoEditor.exe")) { throw 'App EXE missing' }
      - name: Smoke test audio metadata INSIDE packaged EXE
        shell: pwsh
        run: |
          $audio = Join-Path $env:RUNNER_TEMP 'тестовая_песня.mp3'
          & (Get-Command ffmpeg.exe).Source -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=440:duration=2' -c:a libmp3lame $audio
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create test MP3' }
          & '.\\dist\\CapCutAutoEditor\\CapCutAutoEditor.exe' --self-test-media $audio
          if ($LASTEXITCODE -ne 0) { throw "Installed EXE failed to read MP3 (exit $LASTEXITCODE)" }
      - name: Smoke test VIDEO CONVERSION inside packaged EXE
        shell: pwsh
        run: |
          $sample = Join-Path $env:RUNNER_TEMP 'проверка_футажа.mp4'
          & (Get-Command ffmpeg.exe).Source -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=640x360:rate=25:duration=7' -c:v mpeg4 -q:v 5 $sample
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create test source video' }
          & '.\\dist\\CapCutAutoEditor\\CapCutAutoEditor.exe' --self-test-video $sample
          if ($LASTEXITCODE -ne 0) { throw "Packaged EXE failed video conversion (exit $LASTEXITCODE)" }
      - name: Package Windows installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\capcut.iss'
          $installer = 'dist\release\CapCutAutoEditor_Setup.exe'
          if (!(Test-Path $installer)) { throw 'Installer missing' }
          $checksum = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  CapCutAutoEditor_Setup.exe" | Set-Content 'dist\release\CapCutAutoEditor_Setup.exe.sha256' -Encoding ascii
      - name: Upload workflow test artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapCutAutoEditor-Windows-Setup
          path: |
            dist/release/CapCutAutoEditor_Setup.exe
            dist/release/CapCutAutoEditor_Setup.exe.sha256
      - name: Publish verified GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Will not replace an installed update."
          } else {
            gh release create $tag `
              'dist/release/CapCutAutoEditor_Setup.exe' `
              'dist/release/CapCutAutoEditor_Setup.exe.sha256' `
              --target "${{ github.sha }}" --generate-notes --title "CapCut Auto Editor $tag"
          }
